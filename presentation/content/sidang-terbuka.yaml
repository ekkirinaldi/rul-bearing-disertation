          pendahuluan, agar mewakili tiga bias induktif yang berbeda. Dengan begitu uji
          universalitas interpretabilitas SAE-BPFx tidak bergantung pada satu paradigma
          arsitektur tunggal, dan gradien ukuran model (249 ribu sampai 898 ribu
          parameter) memberi pilihan per tier.
      - type: source
        gap: 0.14
