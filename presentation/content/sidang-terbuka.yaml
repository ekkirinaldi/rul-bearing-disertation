      - type: metrics
        gap: 0.26
        columns: 2
        row_gap: 0.44
        items:
          - value: "99,87%"
            title: Akurasi
            hint: "↑ lebih baik"
            body: >-
              Dari 750 sinyal uji, 749 diklasifikasikan benar (macro F1 = 0,997). Istilah “pp”
              (poin persentase): turun 3,60 pp berarti turun 3,60 angka pada skala 0–100
              (99,73 menjadi 96,13), bukan 3,6% relatif.
          - value: "0,940"
            title: Split-half stability
            hint: "↑ · skala 0–1"
            body: >-
              Konsistensi peta atribusi diuji dengan membelah dua data uji: peta dibuat di tiap belahan lalu dibandingkan. Nilai 0,940 berarti kedua belahan mirip 94%, sehingga penjelasan stabil dan bukan kebetulan.
          - value: "17,6%"
            title: Severity monotonicity
            hint: "↑ lebih baik"
            body: >-
              Kerusakan datang dalam ukuran kecil hingga besar; model yang baik bereaksi makin
              kuat saat makin parah. Angka ini adalah porsi yang patuh pola tersebut.
              Bola 17,6% > cincin dalam 13,8% > cincin luar 8,6%.
          - value: "0,735"
            title: Discriminability index
            hint: "↑ · skala 0–1"
            body: >-
              Ukuran perbedaan *fingerprint* atribusi antarjenis kerusakan; makin tinggi makin mudah dibedakan. Menghapus BatchNorm menajamkan *fingerprint* tersebut: 0,315 menjadi 0,735 (naik 2,3 kali).

  # ======================================================================
  # B6 · PANDUAN METRIK PROGNOSTIK (lengkap)
  # ======================================================================
  - layout: content
    eyebrow: "Cadangan · Panduan Metrik 2 dari 2"
    title: Cara Membaca Angka pada Prognostik dan Validasi
    top: 1.60
    blocks:
      - type: banner
        tone: light
        h: 0.56
        vpad: 0.13
        size: 11
        label: "Panduan:"
        label_w: 0.85
        body: >-
          model memprediksi sisa umur (RUL) pada skala 0–1   ·   fitur laten model diperiksa korelasinya terhadap frekuensi kerusakan (BPFx)   ·   seluruh temuan diuji ulang secara statistik.
      - type: metrics
        gap: 0.20
        columns: 2
        row_gap: 0.16
        badge_size: 1.00
        items:
          - value: "0,226"
            title: "RMSE (rata-rata galat)"
            hint: "↓ lebih baik"
            body: >-
              Rata-rata selisih prediksi sisa umur terhadap nilai referensi, skala 0–1 (0 = sempurna). Notasi “± 0,030” adalah variasi hasil antar tiga seed; makin kecil makin andal.
          - value: "2,3%"
            title: Hit-rate
            hint: "↑ lebih baik"
            body: >-
              Persentase fitur laten (dari 1.024) yang berkorelasi dengan satu frekuensi kerusakan (BPFx). Nilai 2,3% berarti puluhan fitur menangkap frekuensi cincin dalam (BPFI).
          - value: "0,447"
            title: "rmax (korelasi tertinggi)"
            hint: "↑ · skala 0–1"
            body: >-
              Korelasi tertinggi satu fitur laten terhadap amplitudo frekuensi kerusakan adalah 0,447, tergolong sedang menuju kuat untuk satu unit.
          - value: "p<0,004"
            value_size: 15
            title: p-value dan koreksi Bonferroni
            hint: "↓ lebih baik"
            body: >-
              Peluang hasil muncul karena kebetulan; makin kecil makin meyakinkan.
              Karena 12 uji primer dijalankan sekaligus, ambang signifikansi diperketat ke 0,004
              (bukan 0,05).
          - value: "≈0%"
            title: "Negative control (kontrol negatif)"
            hint: "harus ≈ 0"
            body: >-
              Analisis yang sama dijalankan pada model berbobot acak dan derau murni.
              Jika metode hanya menemukan pola dalam keacakan, angka ini ikut tinggi.
              Hasilnya ≈0%, sehingga temuan bukan artefak metode.
          - value: "10,3%"
            title: Sisa umur (RUL) dan EoL
            hint: "↓ = dekat rusak"
            body: >-
              Sisa umur dalam persen. Ambang peringatan 40% dan ambang kritis 20%; di
              bawah 20% status berpindah ke Critical. EoL adalah perkiraan tanggal dan jam
              bearing mencapai akhir umur.
          - value: "53%"
            title: "Fusion gate (gerbang fusi)"
            hint: konteks
            body: >-
              Gate menimbang kontribusi dua cabang model (xLSTM dan Mamba); “Mamba 53%” berarti keluaran pada kanal itu sedikit condong ke cabang Mamba.

