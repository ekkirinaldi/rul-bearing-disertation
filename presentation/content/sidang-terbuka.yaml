      - type: source
        gap: 0.14
        body: "Asset Diagnostic Methodology (ADM), materi pelatihan SKF Group (2017)"

  # ======================================================================
  # 10 · PENGANTAR DOMAIN — vibration signature, static dan dynamic data (draft hal. 11)
  # ======================================================================
  - layout: content
    eyebrow: "Pengantar Domain · Sinyal Getaran"
    title: "Setiap Komponen Mesin Punya *Vibration Signature* Sendiri"
    top: 1.72
    blocks:
      - type: columns
        h: 3.92
        gutter: 0.28
        items:
          - width: 7.60
            blocks:
              - type: figure
                flex: true
                inset: 0.08
                image: ../assets/skf/skf_vibration_signature.png
              - type: text
                gap: 0.06
                h: 0.30
                size: 9.5
                italic: true
                align: center
                color: "6B7689"
                text: "Rotor, motor, gear mesh, coupling, dan bearing masing-masing bergetar pada frekuensinya; sensor mengukur jumlahnya"
          - blocks:
              - type: cards
                flex: true
                columns: 1
                row_gap: 0.12
                pad: 0.14
                title_size: 12
                body_size: 10.5
                items:
                  - title: "*Static data*: satu angka"
                    body: >-
                      Sinyal jumlahan diringkas menjadi nilai RMS, misalnya 2,3 mm/s.
                      Hanya 2 byte per pengukuran; cukup untuk tren, tidak cukup untuk
                      tahu komponen mana yang memburuk.
                    body_color: "1F2A3D"
                  - title: "*Dynamic data*: bentuk gelombang utuh"
                    body: >-
                      Sinyal domain waktu selengkapnya, sekitar 4.000 byte, diurai FFT
                      menjadi spektrum. Perubahan pada satu komponen frekuensi menunjuk
                      komponen mesin yang rusak.
                    body_color: "1F2A3D"
      - type: banner
        gap: 0.18
        tone: dark
        size: 11.5
        vpad: 0.14
        body: >-
          Disertasi ini bekerja pada *dynamic data*: **raw signal 2.048 titik** untuk
          jalur diagnostik, dan **feature spektral dari waveform 25,6 kHz** untuk jalur
          prognostik; nilai tren SKF Observer dipakai hanya pada validasi lapangan.
      - type: source
        gap: 0.12
        body: "diadaptasi dari materi pelatihan condition monitoring SKF Group (2017)"

  # ======================================================================
  # 11 · PENGANTAR DOMAIN — prognostik dan sisa umur pakai pada kurva kondisi (draft hal. 12)
  # ======================================================================
  - layout: content
    eyebrow: "Pengantar Domain · Prognostik"
    title: "Prognostik Mengestimasi Sisa Umur Pakai pada Kurva Kondisi"
    top: 1.72
    blocks:
      - type: columns
        h: 3.92
        gutter: 0.28
        items:
          - width: 7.00
            blocks:
              - type: figure
                flex: true
