  # ======================================================================
  - layout: content
    eyebrow: Latar Belakang
    title: "Bearing: Tumpuan Setiap Mesin, Sekaligus Titik Paling Rentan"
    top: 1.74
    blocks:
      - type: columns
        h: 3.26
        gutter: 0.30
        items:
          - width: 7.10
            blocks:
              - type: text
                size: 13
                h: 1.44
                text: >-
                  Pada hampir setiap mesin rotasi industri, mulai dari motor, pompa, kompresor,
                  hingga lini otomasi, ***rolling element bearing*** menjadi tumpuan.
                  Justru komponen inilah yang paling sering gagal: studi empiris mencatat
                  bearing menyumbang sekitar 40 sampai 50% dari seluruh kerusakan mesin
                  rotasi, sekaligus menjadi penyebab utama *downtime* yang tidak terencana
                  di industri manufaktur.
              - type: text
                size: 13
                gap: 0.14
                flex: true
                text: >-
                  Inisiatif ***Making Indonesia 4.0*** mendorong industri beralih ke perawatan
                  cerdas: memanfaatkan sensor dan kecerdasan buatan untuk mengenali tanda
                  kerusakan sebelum mesin berhenti. Perawatan prediktif berbasis kondisi hadir
                  sebagai paradigma baru, karena keputusan intervensi tidak lagi berpijak pada
                  jadwal tetap melainkan pada kondisi aktual mesin yang diukur secara real-time.
          - blocks:
              - type: stats
                tone: dark
                align: center
                valign: middle
                h: 1.78
                value_size: 46
                note_size: 11.5
                items:
                  - value: "40–50%"
                    note: "kerusakan mesin rotasi industri berakar pada kegagalan bearing  (Lei, 2018)"
              - type: cards
                gap: 0.14
                align: center
                flex: true
                gutter: 0.12
                pad: 0.12
                title_size: 12
                body_size: 10
                items:
                  - title: KOREKTIF
                    title_color: "6B7689"
                    body: "Bertindak setelah rusak, sehingga downtime tak terduga"
                    body_color: "1F2A3D"
                  - title: PREVENTIF
                    title_color: "6B7689"
                    body: "Ganti terjadwal: boros, atau komponen aus terlewat"
                    body_color: "1F2A3D"
                  - title: PREDIKTIF
                    title_color: "16284B"
                    body: "Berbasis kondisi aktual mesin secara real-time"
                    body_color: "1F2A3D"
      - type: banner
        gap: 0.24
        tone: light
        label: KONTEKS INDUSTRI
        label_size: 12
        size: 11.5
        vpad: 0.16
        body: >-
          Penelitian ini berangkat dari kasus nyata di **PT SKF Indonesia (Cikarang)**:
          mesin grinding outer ring (OR-1) yang memproduksi cincin luar bearing untuk sektor
          otomotif. Sasarannya menekan downtime tak terencana sekaligus mencegah masalah
          kualitas akibat keausan.

