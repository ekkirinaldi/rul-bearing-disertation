                    items:
                      - >-
                        Setiap dataset hanya mencakup satu kondisi operasi, dengan partisi
                        bearing-wise pada kondisi yang sama.
                      - >-
                        CWRU memakai kerusakan buatan (EDM) yang morfologinya lebih teratur
                        dibanding fatik alami.
                      - >-
                        SAE bersifat post-hoc; pelatihan in-loop berpotensi menghasilkan
                        korespondensi yang lebih kuat.
                      - >-
                        CWRU kurang bertenaga secara statistik untuk SAE (p > 0,05 meski
                        hit-rate 5,08%).
                      - >-
                        Integrasi data kualitas (radial clearance) belum dieksekusi dan
                        menjadi prioritas utama.
                      - >-
                        Validasi industri masih kualitatif: satu mesin, dua channel,
                        pseudo-waveform.
