  - layout: content
    eyebrow: "Hasil Diagnostik · Novelti N2"
    title: "Trade-off BatchNorm: Akurasi dan Interpretabilitas"
    top: 1.78
    blocks:
      - type: columns
        h: 3.00
        gutter: 0.23
        items:
          - width: 4.55
            blocks:
              - type: panel
                flex: true
                tone: white
                title: Varian A, dengan BatchNorm
                title_size: 15
                blocks:
                  - type: stats
                    h: 1.10
                    gutter: 0.14
                    tone: plain
                    value_size: 34
                    items:
                      - value: "99,73%"
                        value_color: B8923B
                        note: akurasi
                      - value: "0,315"
                        note: diskriminabilitas FSM
                  - type: rule
                    gap: 0.06
                  - type: text
                    gap: 0.12
                    flex: true
                    size: 11.5
                    text: >-
                      Diskriminabilitas lebih rendah, namun akurasi tertinggi, sehingga dipilih
                      untuk prioritas akurasi operasional pada Tier 2.
          - width: 4.55
            blocks:
              - type: panel
                flex: true
                tone: white
                title: Varian C, tanpa BatchNorm
                title_size: 15
                blocks:
                  - type: stats
                    h: 1.10
                    gutter: 0.14
                    tone: plain
                    value_size: 34
                    items:
                      - value: "96,13%"
                        value_color: C0392B
                        note: "akurasi  (−3,60 pp)"
                      - value: "0,735"
                        note: diskriminabilitas FSM
                  - type: rule
                    gap: 0.06
                  - type: text
                    gap: 0.12
                    flex: true
                    size: 11.5
                    text: >-
                      Akurasi turun, tetapi atribusi jauh lebih tajam, sehingga dipilih ketika
                      auditabilitas sinyal diutamakan (riset atau inspeksi).
          - blocks:
              - type: stats
                flex: true
                tone: dark
                align: center
                valign: middle
                value_size: 42
                note_size: 12
                items:
                  - value: "+133%"
                    note:
                      - "diskriminabilitas FSM (2,3 kali lipat)"
                      - " "
                      - "**0,315 → 0,735**"
                    note_color: D8E0EE
      - type: banner
        gap: 0.20
        tone: light
        size: 12
        vpad: 0.16
        body: >-
          **Mekanisme.** Tanpa normalisasi, gradien tidak lagi tersebar merata: perbedaan
          aktivasi terfokus pada posisi impuls cacat sehingga atribusi SHAP menjadi lebih tajam
          dan terlokalisasi. Inilah hubungan *interpretability–accuracy trade-off* yang untuk
          pertama kalinya didokumentasikan secara kuantitatif dalam literatur klasifikasi bearing.
      - type: source
        gap: 0.16
        body: >-
          Batch Normalization (Ioffe dan Szegedy, 2015); studi ablasi tiga varian WDCNN
          (Suharto dkk., 2025). Akurasi pada slide ini memakai protokol ablasi 50 epoch
          terkontrol, berbeda dari protokol utama ber-early-stopping yang menghasilkan 99,87%;
          diskriminabilitas dihitung pada subset ablasi 30 background / 50 sampel uji.

