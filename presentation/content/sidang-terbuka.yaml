  - layout: content
    eyebrow: "Hasil Diagnostik · Novelti N1"
    title: Fault Signature Maps sebagai XAI pada Sinyal Mentah
    top: 1.74
    blocks:
      - type: text
        size: 13
        h: 0.70
        text: >-
          SHAP DeepExplainer diterapkan langsung pada 2.048 titik sinyal (300 sampel
          *background* dan 500 sampel uji, menghasilkan lebih dari 10 juta nilai SHAP),
          lalu diagregasi menjadi FSM per kelas dalam tiga varian: Signed, Absolute,
          dan Variance.
      - type: stats
        gap: 0.18
        h: 1.50
        items:
          - value: "0,940"
            label: Split-half stability
            note: "Kemiripan kosinus 94%, sehingga pola FSM sangat reproducible lintas subset uji."
          - value: "17,6%"
            label: Severity monotonicity
            note: "Gradasi keparahan terjaga: Ball 17,6% > IR 13,8% > OR 8,6%."
          - value: "0,216"
            label: Discriminability index
            note: "Perbedaan antarkelas terukur pada ruang atribusi 2.048 dimensi."
      - type: panel
        gap: 0.22
        tone: dark
        title: "TEMUAN KUNCI: MORFOLOGI, BUKAN PERIODISITAS"
        title_color: B8923B
        blocks:
          - type: text
            size: 12.5
            color: D8E0EE
            accent: FFFFFF
            text: >-
              Puncak FSM ternyata tidak sejajar dengan periode teoretis BPFO/BPFI/BSF.
              WDCNN mengenali kerusakan dari **morfologi transien impuls**, yang tertangkap
              utuh oleh jendela reseptif kernel pertama (≈ 42,67 ms pada 48 kHz),
              bukan dari periodisitas frekuensi. Karena itu FSM bersifat *transferable*
              tanpa perlu mengetahui BPFx target: model yang dilatih pada satu jenis bearing
              berpotensi dipindahkan ke geometri lain tanpa kalibrasi BPFx terlebih dahulu.
      - type: source
        gap: 0.16
        body: >-
          SHAP DeepExplainer (Lundberg dan Lee, 2017) berbasis DeepLIFT (Shrikumar dkk., 2017);
          formalisasi Fault Signature Maps (Suharto dkk., 2025).

