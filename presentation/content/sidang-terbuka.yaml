          Beban komputasi meningkat bertahap: triage di sensor, identifikasi kerusakan di
          gateway, dan estimasi RUL di cloud. Setiap tier dapat berdiri sendiri namun
          memperkaya tier berikutnya, dan umpan balik Tier 3 ke ERP/CMMS mengintegrasikan RUL
          dengan jadwal produksi.  **Status: konseptual / sintesis.**

