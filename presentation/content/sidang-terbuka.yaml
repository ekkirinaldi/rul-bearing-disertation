# Presentasi Sidang Disertasi — Toto Suharto (NIM 33420002)
#
# Angka, klaim, dan nomor gambar/tabel pada berkas ini bersumber dari naskah
# disertasi V14 (presentation/V14 *.docx) — naskah rujukan sejak Agustus 2026.
# Struktur dek: pengantar domain (materi SKF, dikreditkan), objek penelitian,
# gap dan empat rumusan masalah (Subbab I.2), pengantar sinyal, lalu tiga
# babak per jalur: diagnostik (RM-1, RM-2), prognostik (RM-1, RM-3), dan
# validasi industri (RM-4); setiap babak dibuka pembatas dan ditutup jawaban.
# Slide cadangan untuk sesi tanya jawab ditempatkan setelah slide penutup.
