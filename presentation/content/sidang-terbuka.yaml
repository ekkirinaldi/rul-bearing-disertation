      mampu melakukan deteksi kerusakan dan prediksi remaining useful life bearing akurat,
      sehingga mendukung pengurangan waktu henti yang tidak terencana pada sistem produksi
      manufaktur?

  # ======================================================================
  # 11 · JEMBATAN A — machine learning vs deep learning
  # ======================================================================
  - layout: content
    eyebrow: "Pengantar · Cara Kerja Model"
    title: "Dua Cara Mesin Belajar Mengenali Kerusakan"
    top: 1.72
    blocks:
      - type: cards
        h: 1.52
        gutter: 0.22
        pad: 0.16
        title_size: 12.5
        body_size: 10.5
        items:
          - title: "Machine learning klasik: fitur dirancang manusia"
            body: >-
              Seperti inspektur dengan lembar periksa: manusia memilih indikator (RMS,
              kurtosis, energi pita frekuensi, 36 dimensi), lalu model menimbang
              indikator itu. Transparan, ringan, tetapi bergantung pada kejelian
              perancang fitur.
            body_color: "1F2A3D"
          - title: "Deep learning: fitur dipelajari model"
            body: >-
              Seperti operator berpengalaman yang belajar dari ribuan contoh sinyal
              mentah: WDCNN membaca langsung 2.048 titik getaran dan menemukan sendiri
              pola yang relevan, tanpa perhitungan fitur perantara.
            body_color: "1F2A3D"
      - type: columns
        gap: 0.16
        flex: true
        gutter: 0.30
        items:
