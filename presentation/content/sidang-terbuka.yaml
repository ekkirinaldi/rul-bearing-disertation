            title: "Mamba-xLSTM-Net"
            body: >-
              Selective SSM Mamba digabung memori rekuren mLSTM; menargetkan
              pemodelan konteks panjang dengan presisi tinggi.
          - badge: "B"
            title: "N-BEATS-xLSTM-RUL"
            body: >-
              Basis-blok terstruktur trend/wear/shock dari N-BEATS dengan residual
              xLSTM; memanfaatkan prior struktural bentuk kurva degradasi.
          - badge: "C"
            title: "SparseGate-TCN-RUL"
            body: >-
              Dilated causal convolution dengan sparse gating; model ringan yang
              dirancang untuk deployment di lapisan edge.
