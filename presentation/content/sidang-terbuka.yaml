          - title: "LSTM (1997)"
            body: >-
              Mekanisme gating menjaga dependensi jangka panjang; dominan dalam
              prognostik bearing, tetapi kapasitas memorinya vektor dan gating-nya
              sigmoid yang mudah jenuh.
          - title: "Transformer (2017)"
            body: >-
              Self-attention menangkap konteks global, namun kompleksitasnya
              **kuadratik** terhadap panjang sekuens; menjadi hambatan pada sinyal
              degradasi yang panjang.
          - title: "Mamba dan xLSTM (2023–2024)"
            body: >-
              Dua lini paralel yang mengatasi keterbatasan itu: SSM selektif dengan
              kompleksitas **linear**, dan LSTM yang direvitalisasi dengan
              *exponential gating* dan *matrix memory*.
      - type: cards
        gap: 0.18
        h: 1.86
        gutter: 0.18
        pad: 0.14
        title_size: 12
        body_size: 10.5
        items:
