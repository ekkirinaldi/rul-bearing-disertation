            title: "Yang dicari adalah korelasi, bukan kausalitas"
            body: >-
              Metode XAI menghitung **attribution**: bagian input mana yang paling
              memengaruhi keputusan model. Ia tidak membuktikan bahwa bagian itu
              *menyebabkan* kerusakan; klaim fisis harus diuji terpisah dengan
              statistik.
          - badge: "2"
            title: "Kerusakan bearing jarang, sehingga deteksi harus benar"
            body: >-
              Kelas rusak selalu jauh lebih sedikit daripada kelas sehat di lapangan.
              Alarm palsu menghentikan produksi tanpa sebab; alarm terlewat berujung
              *functional failure*. Penjelasan memungkinkan insinyur memverifikasi
              sebelum bertindak.
          - badge: "3"
            title: "Penjelasan menunjuk bagian yang harus dikoreksi"
            body: >-
              Peta yang menandai segmen sinyal atau feature penentu memberi tahu
              apakah model melihat impuls cacat atau artefak; bila artefak, data,
              sensor, atau modelnya yang dikoreksi, bukan mesinnya.
      - type: banner
        gap: 0.22
        tone: dark
        label: DUA LAPIS
        label_size: 12
        size: 11.8
        vpad: 0.18
        body: >-
          Disertasi ini memakai dua lapis interpretabilitas: **input attribution** (SHAP pada
          raw signal, jalur diagnostik) menjawab "bagian sinyal mana", dan **konsep laten**
          (SAE pada hidden state, jalur prognostik) menjawab "apakah model menyimpan
          BPFx". Keduanya diuji dengan stabilitas, diskriminabilitas, dan *negative control*,
          bukan diterima begitu saja.
      - type: source
        gap: 0.16
        body: "Subbab II.4.1 taksonomi XAI; rumusan RM-3 (Subbab I.2); kerangka dua lapis pada Bab VI"

