  # ======================================================================
  - layout: content
    eyebrow: "Pengantar Domain · Nilai Reliability Program"
    title: "Komponen Biaya Terbesar Bukan Suku Cadang, melainkan Kehilangan Potensi Produksi"
    top: 1.72
    blocks:
      - type: columns
        h: 3.84
        gutter: 0.30
        items:
          - width: 5.60
            blocks:
              - type: figure
                flex: true
                inset: 0.08
                image: ../assets/skf/skf_reliability_savings.png
              - type: text
                gap: 0.06
                h: 0.30
                size: 9.5
                italic: true
                align: center
                color: "6B7689"
                text: "Struktur biaya sebelum dan sesudah *reliability program*; komponen terbesar adalah kehilangan potensi produksi"
          - blocks:
              - type: text
                h: 0.62
                size: 12
                text: >-
                  Biaya terbesar bukan suku cadang atau tenaga kerja, melainkan **kehilangan potensi
                  produksi dan masalah kualitas**. *Reliability program* yang baik menekan
                  komponen itu lebih dahulu, lalu energi, tenaga kerja, dan persediaan.
              - type: numbered
                gap: 0.12
                flex: true
                size: 11.3
                items:
                  - "Meningkatkan keselamatan kerja"
                  - "Menaikkan output produksi dan efisiensi pabrik"
                  - "Memperbaiki kualitas produk"
                  - "Menurunkan konsumsi energi dan bahan bakar"
                  - "Mengurangi risiko lingkungan"
                  - "Mengurangi persediaan suku cadang"
                  - "Memperbaiki laba bersih"
      - type: banner
        gap: 0.20
        tone: dark
        size: 11.5
        vpad: 0.16
        body: >-
          Tiga sasaran yang diperbaiki sekaligus: **availability**, **efisiensi**, dan
          **arus kas**. Perawatan prediktif adalah cara mencapainya dengan memutuskan
          intervensi berdasarkan kondisi mesin, bukan jadwal tetap.
      - type: source
        gap: 0.14
        body: "diadaptasi dari materi pelatihan *reliability* SKF Group (2017)"

  # ======================================================================
  # 7 · PENGANTAR DOMAIN — functional failure dan kurva P-F (draft hal. 7)
  # ======================================================================
  - layout: content
    eyebrow: "Pengantar Domain · Kurva P-F"
    title: "Interval P-F Memberi Rentang Waktu antara Gejala Awal dan Functional Failure"
    top: 1.72
    blocks:
      - type: columns
        h: 3.38
        gutter: 0.28
        items:
          - width: 7.40
            blocks:
              - type: figure
                flex: true
                inset: 0.08
                image: ../assets/skf/skf_functional_failure.png
              - type: text
                gap: 0.06
                h: 0.30
                size: 9.5
                italic: true
                align: center
                color: "6B7689"
                text: "Kurva P-F: dari gejala awal (P) sampai *functional failure* (F), lalu MTTR dan MTBF"
          - blocks:
              - type: cards
                flex: true
                columns: 1
                row_gap: 0.10
                pad: 0.14
                title_size: 12
                body_size: 10.5
                items:
                  - title: "P, gejala awal (*potential failure*)"
                    body: >-
                      Titik ketika kerusakan mulai terdeteksi oleh pengukuran, jauh sebelum
                      mesin kehilangan fungsinya.
                    body_color: "1F2A3D"
                  - title: "F, *functional failure*"
                    body: >-
                      Mesin berhenti menjalankan fungsinya; risiko keselamatan dan biaya
                      perawatan berada di titik tertinggi.
                    body_color: "1F2A3D"
                  - title: "MTTR dan MTBF"
                    body: >-
                      Lama perbaikan dan jarak antar-*failure*; keduanya memburuk bila
                      intervensi baru dilakukan setelah titik F.
                    body_color: "1F2A3D"
      - type: banner
        gap: 0.20
        tone: dark
        label: POSISI PdM
        label_size: 12
        size: 11.5
        vpad: 0.16
        body: >-
          Selang antara P dan F adalah ruang kerja perawatan prediktif: **deteksi
          kerusakan** menjawab "ada apa" (jalur diagnostik disertasi ini), dan **prediksi
          sisa umur** menjawab "berapa lama lagi" (jalur prognostik).
      - type: source
        gap: 0.14
        body: "diadaptasi dari materi pelatihan *reliability* SKF Group (2017)"

  # ======================================================================
  # 8 · PENGANTAR DOMAIN — Asset Diagnostic Methodology (draft hal. 8-9)
  # ======================================================================
  - layout: content
    eyebrow: "Pengantar Domain · Asset Diagnostic Methodology"
    title: "Asset Diagnostic Methodology Menghubungkan Aset dengan Titik Pengukuran"
    top: 1.72
    blocks:
      - type: columns
        h: 3.92
        gutter: 0.30
        items:
          - width: 3.30
            blocks:
              - type: figure
                flex: true
                inset: 0.08
                image: ../assets/skf/skf_adm_hierarchy.png
          - blocks:
              - type: kvrows
                flex: true
                label_w: 1.70
                row_h: 0.50
                items:
                  - label: ASSET
                    value: "Sebuah aset diuraikan menjadi komponen-komponennya."
                  - label: COMPONENT
                    value: "Setiap komponen memiliki beberapa *failure mode*; semuanya didaftar per komponen."
                  - label: FAILURE
                    value: "Satu *failure mode* ditandai oleh satu *fault* atau kombinasi beberapa *fault*."
                  - label: FAULT
                    value: "Sebuah *fault* terdeteksi bila satu gejala atau kombinasi gejala hadir."
                  - label: SYMPTOM
                    value: "Sebuah gejala terdeteksi bila satu atau lebih *key feature* melewati ambang alarm."
                  - label: KEY FEATURE
                    value: "Sinyal yang dibangkitkan aset saat beroperasi, misalnya amplitudo pada frekuensi tertentu."
                  - label: MEASUREMENT
                    value: "Pengukuran harus diatur agar seluruh *key feature* yang mungkin ikut tertangkap."
      - type: banner
        gap: 0.18
        tone: light
        size: 11.5
        vpad: 0.14
        body: >-
          Pendekatan **reaktif** bekerja dari atas: *failure* terjadi, lalu komponennya
          diganti. Pendekatan **proaktif** bekerja dari bawah: pengukuran yang tepat
          menangkap *key feature*, gejala, dan *fault* jauh sebelum *failure*.
      - type: source
        gap: 0.12
        body: "Asset Diagnostic Methodology (ADM), materi pelatihan SKF Group (2017)"

