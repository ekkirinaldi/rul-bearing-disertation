  # ======================================================================
  - layout: content
    eyebrow: "Panduan Metrik · 1 dari 2"
    title: Cara Membaca Angka pada Jalur Diagnostik
    top: 1.60
    blocks:
      - type: banner
        tone: light
        h: 0.56
        vpad: 0.13
        size: 11
        label: "Panduan:"
        label_w: 0.85
        body: >-
          ↑ makin tinggi makin baik   ·   ↓ makin rendah makin baik   ·   rentang 0–1 bila
          disebut   ·   semua metrik dilaporkan dengan tiga seed dan selang kepercayaan.
      - type: metrics
        gap: 0.26
        columns: 2
        row_gap: 0.44
        items:
          - value: "99,87%"
            title: Akurasi
            hint: "↑ lebih baik"
            body: >-
              Dari 750 sinyal uji, 749 ditebak benar (macro F1 = 0,997). Istilah “pp”
              (poin persentase): turun 3,60 pp berarti turun 3,60 angka pada skala 0–100
              (99,73 menjadi 96,13), bukan 3,6% relatif.
          - value: "0,940"
            title: Split-half stability
            hint: "↑ · skala 0–1"
            body: >-
              Apakah “peta perhatian” model konsisten? Data uji dibelah dua, peta dibuat di
              tiap belahan, lalu dibandingkan. Nilai 0,940 berarti dua belahan mirip 94%,
              sehingga penjelasan stabil dan bukan kebetulan.
          - value: "17,6%"
            title: Severity monotonicity
            hint: "↑ lebih baik"
            body: >-
              Kerusakan datang dalam ukuran kecil hingga besar; model yang baik bereaksi makin
              kuat saat makin parah. Angka ini adalah porsi yang patuh pola tersebut.
              Bola 17,6% > cincin dalam 13,8% > cincin luar 8,6%.
          - value: "0,735"
            title: Discriminability index
            hint: "↑ · skala 0–1"
            body: >-
              Seberapa beda “sidik jari” antar jenis kerusakan. Tinggi berarti mudah dibedakan.
              Mematikan komponen BatchNorm menajamkan sidik jari: 0,216 menjadi 0,735
              (naik 2,3 kali).

  # ======================================================================
  - layout: content
    eyebrow: "Panduan Metrik · 2 dari 2"
    title: Cara Membaca Angka pada Prognostik dan Validasi
    top: 1.60
    blocks:
      - type: banner
        tone: light
        h: 0.56
        vpad: 0.13
        size: 11
        label: "Panduan:"
        label_w: 0.85
        body: >-
          model menebak sisa umur (RUL) pada skala 0–1   ·   diperiksa apakah “detektor”
          internal model mengunci “ketukan” kerusakan (BPFx)   ·   semua diuji ulang agar
          bukan kebetulan.
      - type: metrics
        gap: 0.20
        columns: 2
        row_gap: 0.16
        badge_size: 1.00
        items:
          - value: "0,226"
            title: "RMSE (rata-rata galat)"
            hint: "↓ lebih baik"
            body: >-
              Seberapa meleset tebakan sisa umur, pada skala 0–1 (0 = sempurna).
              Notasi “± 0,030” adalah goyangan hasil saat diulang tiga kali; kecil = andal.
          - value: "2,3%"
            title: Hit-rate
            hint: "↑ lebih baik"
            body: >-
              Dari sekitar 1.024 “detektor” internal, berapa persen yang mengunci satu
              “ketukan” kerusakan (BPFx). Nilai 2,3% berarti puluhan detektor menemukan
              ritme cincin dalam.
          - value: "0,447"
            title: "rmax (kecocokan terbaik)"
            hint: "↑ · skala 0–1"
            body: >-
              Di antara semua detektor, yang paling cocok menyamai “ketukan” kerusakan
              sebesar 0,447; kecocokan sedang hingga kuat untuk satu unit.
          - value: "p<0,004"
            value_size: 15
            title: p-value dan koreksi Bonferroni
            hint: "↓ lebih baik"
            body: >-
              Peluang hasil muncul karena kebetulan; makin kecil makin meyakinkan.
