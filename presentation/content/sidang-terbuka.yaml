                  - "Cincin dalam (inner ring)  →  **BPFI**"
                  - "Bola (rolling element)  →  **BSF**"
                  - "Sangkar (cage)  →  **FTF**"
          - blocks:
              - type: cards
                flex: true
                columns: 1
                row_gap: 0.08
                pad: 0.14
                title_size: 12.5
                body_size: 10.5
                items:
                  - title: Bearing (bantalan)
                    body: >-
                      Komponen yang menopang poros agar berputar mulus; tersusun atas cincin
                      luar, cincin dalam, bola, dan sangkar.
                    body_color: "1F2A3D"
                  - title: "Frekuensi khas kerusakan (BPFx)"
                    body: >-
                      Cacat pada tiap komponen menimbulkan benturan berulang pada frekuensi yang khas untuk komponen itu: BPFO, BPFI, BSF, FTF.
                    body_color: "1F2A3D"
                  - title: RUL, sisa umur pakai
                    body: >-
                      Perkiraan lamanya bearing masih sanggup bekerja sebelum rusak,
                      dinyatakan pada skala 0 sampai 1: 1 = baru, 0 = rusak.
                    body_color: "1F2A3D"
                  - title: FSM, peta panas atribusi
                    body: >-
                      Gambar yang menandai bagian sinyal getaran mana yang paling dipakai
                      model untuk mengenali jenis kerusakan.
                    body_color: "1F2A3D"
                  - title: "Fitur laten (SAE)"
                    body: >-
                      Ribuan unit internal model; korelasinya terhadap frekuensi kerusakan diperiksa sebagai bukti model menangkap fisika nyata.
                    body_color: "1F2A3D"

