# Perbarui berkas ini, bukan .pptx-nya; jalankan `make build` untuk merender.
# Gambar dari media V14 diekstrak lewat `make v14-assets` ke assets/v14/.
#
# Markup teks:  **tebal**  ·  *miring*  ·  ***tebal miring***  ·  ~~redup~~

