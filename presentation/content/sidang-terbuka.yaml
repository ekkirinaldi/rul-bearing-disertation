              - type: text
                gap: 0.06
                h: 0.30
                size: 9.5
                italic: true
                align: center
                color: "6B7689"
                text: "Kondisi mesin terhadap waktu operasi: pita normal, tiga ambang, dan sebaran prediksi RUL"
          - blocks:
              - type: cards
                flex: true
                columns: 1
                row_gap: 0.10
                pad: 0.13
                title_size: 11.5
                body_size: 10.2
                items:
                  - title: "Ambang deteksi anomali"
                    body: "Kondisi keluar dari pita operasi normal; diagnostik prediktif dimulai."
                    body_color: "1F2A3D"
                  - title: "Ambang diagnosis"
                    body: "Jenis kerusakan dapat dikenali dari *signature*-nya; prognosis dimulai."
                    body_color: "1F2A3D"
                  - title: "Ambang *functional failure*"
                    body: "Titik *end-of-life*; mesin harus berhenti sebelum titik ini tercapai."
                    body_color: "1F2A3D"
                  - title: "Sebaran RUL"
                    body: "Prediksi sisa umur selalu berupa rentang; ketidakpastian mengecil mendekati akhir."
                    body_color: "1F2A3D"
      - type: banner
        gap: 0.18
        tone: light
        size: 11.5
        vpad: 0.14
        body: >-
          Remaining useful life (RUL) adalah jarak dari kondisi saat ini ke ambang *functional failure*
          fungsional. Pada disertasi ini RUL dinyatakan sebagai fraksi 1 (baru) sampai 0
          (rusak), dengan ambang status **Warning 40%** dan **Critical 20%**.
      - type: source
        gap: 0.12
        body: "diadaptasi dari materi SKF Group (2017); ambang status mengikuti Subbab V.5.3"

  # ======================================================================
  # 12 · LATAR BELAKANG
  # ======================================================================
  - layout: content
    eyebrow: Latar Belakang
    title: "Bearing sebagai Komponen Paling Kritis pada Mesin Rotasi"
    top: 1.74
    blocks:
      - type: columns
        h: 3.26
        gutter: 0.30
        items:
          - width: 7.10
            blocks:
              - type: text
                size: 13
                h: 1.44
                text: >-
                  Pada hampir setiap mesin rotasi industri, mulai dari motor, pompa, kompresor,
                  hingga *production line* otomatis, ***rolling element bearing*** menjadi tumpuan.
                  Komponen ini sekaligus yang paling sering gagal: survei *reliability* IEEE dan
                  EPRI mencatat bearing menyumbang sekitar 40 sampai 50% dari seluruh kerusakan
                  motor industri, sekaligus menjadi penyebab utama *downtime* yang tidak
                  terencana di industri manufaktur.
              - type: text
                size: 13
                gap: 0.14
                flex: true
                text: >-
                  Inisiatif ***Making Indonesia 4.0*** (April 2018) mendorong industri beralih
                  ke perawatan cerdas: memanfaatkan sensor dan kecerdasan buatan untuk mengenali
                  tanda kerusakan sebelum mesin berhenti. Perawatan prediktif berbasis kondisi
                  hadir sebagai paradigma baru, karena keputusan intervensi tidak lagi berpijak
                  pada jadwal tetap melainkan pada kondisi aktual mesin yang diukur secara
                  real-time.
          - blocks:
              - type: stats
                tone: dark
                align: center
                valign: middle
                h: 1.78
                value_size: 46
                note_size: 11.5
                items:
                  - value: "40–50%"
                    note: "kerusakan motor industri berakar pada *failure* bearing  (Nandi dkk., 2005)"
              - type: cards
                gap: 0.14
                align: center
                flex: true
                gutter: 0.12
                pad: 0.12
                title_size: 12
                body_size: 10
                items:
                  - title: KOREKTIF
                    title_color: "6B7689"
                    body: "Bertindak setelah rusak, sehingga downtime tak terduga"
                    body_color: "1F2A3D"
                  - title: PREVENTIF
                    title_color: "6B7689"
                    body: "Ganti terjadwal: boros, atau komponen aus terlewat"
                    body_color: "1F2A3D"
                  - title: PREDIKTIF
                    title_color: "16284B"
                    body: "Berbasis kondisi aktual mesin secara real-time"
                    body_color: "1F2A3D"
      - type: banner
        gap: 0.24
        tone: light
        label: KONTEKS INDUSTRI
        label_size: 12
        size: 11.5
        vpad: 0.16
        body: >-
          Penelitian ini berangkat dari kasus nyata di **PT SKF Indonesia (Cikarang)**:
          mesin grinding outer ring (OR1 dan OR2) yang memproduksi outer ring bearing untuk
          sektor otomotif. Sasarannya menekan downtime tak terencana sekaligus mencegah
          masalah kualitas akibat keausan.

