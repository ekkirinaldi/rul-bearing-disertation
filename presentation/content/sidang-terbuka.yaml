                  - title: "BPFI"
                    body: "*Ball pass frequency, inner race*: laju rolling element melewati cacat pada inner ring"
                    body_color: "1F2A3D"
                  - title: "BSF"
                    body: "*Ball spin frequency*: laju putar rolling element pada cacat di badannya sendiri"
