[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mxlstm"
version = "0.1.0"
description = "Mamba-xLSTM-Net for bearing RUL prediction with sparse autoencoder interpretability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ekki Rinaldi"}]
dependencies = [
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyWavelets>=1.4",
    "pyarrow>=15",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "rich>=13",
    "loguru>=0.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
mamba_pure = ["mambapy>=1.2"]
mamba_cuda = ["mamba-ssm>=2.0", "causal-conv1d>=1.2"]
xlstm = ["xlstm>=1.0"]
interp = ["shap>=0.44", "captum>=0.7", "umap-learn>=0.5", "hdbscan>=0.8"]
report = ["weasyprint>=60"]
report_pure = ["xhtml2pdf>=0.2.13"]
tuning = ["optuna>=3.6"]
dev = ["pytest>=8", "pytest-cov", "ruff", "black"]
all = [
    "mambapy>=1.2",
    "xlstm>=1.0",
    "shap>=0.44",
    "captum>=0.7",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "weasyprint>=60",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]
