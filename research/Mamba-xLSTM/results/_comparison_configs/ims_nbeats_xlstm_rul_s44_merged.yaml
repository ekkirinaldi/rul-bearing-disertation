data:
  dataset: ims
  root: ../data-bearing/IMS
  cache_dir: ../data-bearing/processed/ims
  window_length: 32
  stride_train: 2
  stride_eval: 16
  label_scheme: linear
  smoothing_alpha: 0.1
  n_bands: 5
  batch_size: 512
  num_workers: 8
  train_bearings:
  - '1'
  - '2'
  val_bearings:
  - '3'
  test_bearings:
  - '4'
model:
  name: nbeats_xlstm_rul
  model_specific_loss: true
  film_num_embeddings: 4
  kurt_index: 8
  lambda_wear_sparse: 0.0001
  hidden_dim: 96
  trend_blocks: 2
  wear_blocks: 2
  shock_blocks: 2
  poly_degree: 4
  n_shock_basis: 14
  dropout: 0.15
  monotone_trend: true
  hybrid_learned_shock: false
  xlstm_d_model: 96
  xlstm_heads: 4
  xlstm_num_blocks: 2
  xlstm_inter_dropout: 0.15
train:
  model_specific_loss: true
  max_epochs: 75
  lr: 0.0008
  weight_decay: 0.0003
  xlstm_lr_mult: 0.75
  freeze_xlstm_epochs: 5
  scheduler: cosine
  warmup_epochs: 5
  monotonicity_weight: 0.05
  gradient_clip_val: 1.0
  early_stopping_patience: 9999
  precision: bf16-mixed
  seed: 42
  results_root: results
  run_id: null
