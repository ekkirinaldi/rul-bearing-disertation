data:
  dataset: xjtusy
  root: ../data-bearing/xtju-sy
  cache_dir: ../data-bearing/processed/xjtusy
  window_length: 32
  stride_train: 1
  stride_eval: 1
  label_scheme: linear
  smoothing_alpha: 0.1
  n_bands: 5
  batch_size: 128
  num_workers: 8
  train_bearings:
  - '1_1'
  - '1_2'
  - '1_3'
  - '2_1'
  - '2_2'
  val_bearings:
  - '1_4'
  test_bearings:
  - '1_5'
  - '2_3'
model:
  name: phase_moe_xlstm_rul
  model_specific_loss: true
  d_model: 128
  n_phases: 3
  dropout: 0.1
  hi_index: 0
  kurt_index: 2
  healthy_window: 8
  lambda_mono: 0.1
  lambda_paris: 0.05
  lambda_phase: 0.1
  healthy_threshold: 0.7
  prefailure_threshold: 0.3
train:
  model_specific_loss: true
  monotonicity_weight: 0.05
  max_epochs: 200
  lr: 0.0008
  weight_decay: 0.0003
  xlstm_lr_mult: 0.75
  freeze_xlstm_epochs: 5
  scheduler: cosine
  warmup_epochs: 5
  gradient_clip_val: 1.0
  early_stopping_patience: 9999
  precision: bf16-mixed
  seed: 42
  results_root: results
  run_id: null
