# PHM2012 — **window/batch only** overlay (legacy “paper window” experiment).
#
# Same bearing split as ``phm2012.yaml`` (dissertation §7.1), default 36-D HI
# (horizontal + vertical), **linear** RUL. Use when you want Table-3-style
# window length / batch size without the Liu §3.2 ISOMAP protocol.
#
# For apples-to-apples baseline vs Mamba under Liu PHM2012, use ``phm2012_paper.yaml``
# + ``configs/train/paper_liu2026.yaml`` instead.
data:
  dataset: phm2012
  root: ../data-bearing/ieee-phm-2012
  cache_dir: ../data-bearing/processed/phm2012

  window_length: 10
  stride_train: 1
  stride_eval: 1

  label_scheme: linear
  smoothing_alpha: 0.1
  n_bands: 5
  batch_size: 32
  num_workers: 0

  train_bearings: ["1_1", "1_2", "1_4", "2_1", "2_3", "2_5", "3_1"]
  val_bearings: ["1_5", "2_2"]
  test_bearings: ["1_3", "1_6", "1_7", "2_4", "2_6", "2_7", "3_2", "3_3"]
