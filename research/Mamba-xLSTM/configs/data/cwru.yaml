data:
  dataset: cwru
  root: ../data-bearing/cwru
  cache_dir: ../data-bearing/processed/cwru

  # CWRU (Case Western Reserve University Bearing Data Center)
  # Bearing type: SKF 6205-2RS (deep-groove ball, n=9, d=7.94 mm, D=39.04 mm)
  # fs = 48 000 Hz, ~48 000 samples per .mat file (1-second steady-state recording)
  # Fault types (seeded): IR = inner race, B = ball, OR = outer race, Normal
  # Fault sizes (mils): 007 = 0.007", 014 = 0.014", 021 = 0.021"
  # Reference: Smith & Randall (2015) Mech. Syst. Signal Process. 64–65, 100-131.
  #
  # Each .mat file is segmented into T = 48 000 // 480 = 100 acquisitions of
  # 480 samples each (~10 ms at 48 kHz) so that the HI pipeline and sequence
  # model can operate on a meaningful time dimension.
  #
  # label_scheme: fault_severity
  #   Assigns a CONSTANT label per file = fault_size_mils / 21  ∈ {0, 1/3, 2/3, 1}
  #   so the model learns to regress fault severity.  Macro-F1 is computed
  #   post-hoc by thresholding the continuous prediction at 1/6, 1/2, 5/6.
  #
  # Split (by fault type × file, load=0):
  #   train : IR007_0_109, IR014_0_174, B007_0_122, B014_0_189,
  #           OR007_6_3_138, OR014_6_3_204, Time_Normal_0_097, Time_Normal_1_098
  #   val   : IR021_0_213, B021_0_226, OR021_6_3_241, Time_Normal_2_099
  #   test  : IR007_1_110, B007_1_123, OR007_6_0_135, Time_Normal_3_100

  window_length: 32
  stride_train: 2
  stride_eval: 16

  label_scheme: fault_severity
  smoothing_alpha: 0.05
  n_bands: 5
  batch_size: 128
  num_workers: 0

  train_bearings:
    - "IR007_0_109"
    - "IR014_0_174"
    - "B007_0_122"
    - "B014_0_189"
    - "OR007_6_3_138"
    - "OR014_6_3_204"
    - "Time_Normal_0_097"
    - "Time_Normal_1_098"
  val_bearings:
    - "IR021_0_213"
    - "B021_0_226"
    - "OR021_6_3_241"
    - "Time_Normal_2_099"
  test_bearings:
    - "IR007_1_110"
    - "B007_1_123"
    - "OR007_6_0_135"
    - "Time_Normal_3_100"
