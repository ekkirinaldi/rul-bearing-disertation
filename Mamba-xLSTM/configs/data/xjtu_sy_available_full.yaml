# XJTU-SY — full three-condition dissertation split (35Hz12kN, 37.5Hz11kN, 40Hz10kN).
#
# Previously only conditions 1–2 were usable because ``40Hz10kN`` (and parts of C2) were
# incomplete on disk. With the repaired ``../data-bearing/xtju-sy`` tree, all 15 bearings
# are available and this split covers every operating condition.
#
# **Per-condition bearing-wise split (no sample leakage):**
# - Train: three bearings per condition (9 total) — mix of run lengths for HI scaler fit.
# - Val:   one bearing per condition (3 total) — disjoint from test; checkpoint probe.
# - Test:  one bearing per condition (3 total) — ``1_5`` (short C1), ``2_3`` (long C2),
#          ``3_3`` (medium C3; same test bearing as Liu et al. 2026 Table 1 track).
#
# stride_eval: 1 → dense validation/test windows (small per-bearing test sets).

data:
  dataset: xjtusy
  root: ../data-bearing/xtju-sy
  cache_dir: ../data-bearing/processed/xjtusy

  window_length: 32
  stride_train: 1
  stride_eval: 1

  label_scheme: linear
  smoothing_alpha: 0.1
  n_bands: 5
  batch_size: 128
  num_workers: 0

  train_bearings: ["1_1", "1_2", "1_3", "2_1", "2_2", "2_4", "3_1", "3_2", "3_4"]
  val_bearings:   ["1_4", "2_5", "3_5"]
  test_bearings:  ["1_5", "2_3", "3_3"]
