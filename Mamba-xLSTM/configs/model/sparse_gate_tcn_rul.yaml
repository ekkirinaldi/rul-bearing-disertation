model:
  name: sparse_gate_tcn_rul
  # Enables ``SparseTCNLoss`` (pinball + gate terms) in ``RULLitModule``; see
  # ``sparse_gate_tcn_rul.py`` / ``sparse_gate_tcn_core.py`` revert notes for MSE-only.
  model_specific_loss: true
  tcn_channels: [64, 64, 128, 128]
  tcn_kernel: 3
  gate_hidden: 32
  gate_context: 5
  attn_d_model: 32
  attn_heads: 4
  head_hidden: 64
  dropout: 0.1
  lambda_sparse: 0.001
  lambda_entropy: 0.001

train:
  model_specific_loss: true
